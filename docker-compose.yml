version: '3.8'

services:
  db:
    image: postgres:15
    container_name: qing-agent-db
    environment:
      POSTGRES_USER: qing_agent
      POSTGRES_PASSWORD: qing_agent_password
      POSTGRES_DB: qing_agent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qing_agent"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qing-agent-api
    environment:
      DATABASE_URL: postgresql://qing_agent:qing_agent_password@db:5432/qing_agent
      AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID}
      AUTH0_API_AUDIENCE: ${AUTH0_API_AUDIENCE}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: qing-agent-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
